# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev, beta]
  pull_request:
    branches: [main, master, beta, dev]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          #- {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The dartR packages this package needs come from the Github branch that
      # matches the branch being checked: dev from dev, beta from beta (also for
      # pull requests into them). main matches CRAN and is checked against the
      # CRAN releases (DARTR_BRANCH empty). This file is the same on all
      # branches, so merges between them do not change it.
      DARTR_BRANCH: ${{ contains(fromJSON('["dev", "beta"]'), github.base_ref || github.ref_name) && (github.base_ref || github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # SIBER (suggested by dartR.base) needs rjags, and rjags 5 needs JAGS 5.
      # Where the system offers only an older JAGS (Ubuntu ships 4.3.2), rjags
      # cannot be built, so SIBER is skipped; R CMD check does not require
      # suggested packages. Once JAGS 5 is available, SIBER is installed again.
      - name: Skip SIBER while JAGS 5 is not available
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          v=$(apt-cache policy jags | awk '/Candidate:/ {print $2}' | sed 's/^[0-9]*://')
          echo "JAGS offered by apt: ${v:-none}"
          case "$v" in
            [5-9]*|[1-9][0-9]*) echo "JAGS 5 or newer: SIBER is installed" ;;
            *) echo "IGNORE_ON_LINUX=SIBER=?ignore" >> "$GITHUB_ENV"
               echo "No JAGS 5: SIBER is skipped" ;;
          esac

      # main: dartR dependencies from CRAN
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: env.DARTR_BRANCH == ''
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ env.IGNORE_ON_LINUX }}
          needs: check

      # dev and beta: dartR dependencies from the same Github branch
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: env.DARTR_BRANCH != ''
        with:
          extra-packages: |
            any::rcmdcheck
            github::green-striped-gecko/dartR.data@${{ env.DARTR_BRANCH }}
            github::green-striped-gecko/dartR.base@${{ env.DARTR_BRANCH }}
            github::green-striped-gecko/dartR.sim@${{ env.DARTR_BRANCH }}
            ${{ env.IGNORE_ON_LINUX }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
